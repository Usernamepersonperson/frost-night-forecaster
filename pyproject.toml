[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frost-night-forecaster"
version = "0.1.0"
description = "Open-source spring frost early warning for vineyards and orchards: evening Tmin forecast, frost probability, cold-air-pool risk map, alarm JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
fetch = ["rasterio>=1.3"]

[project.scripts]
frost-night = "frost_night_forecaster.cli:main"

[tool.setuptools]
packages = ["frost_night_forecaster"]

[tool.setuptools.package-data]
frost_night_forecaster = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
